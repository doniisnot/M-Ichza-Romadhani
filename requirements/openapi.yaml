openapi: 3.0.3info:title: AI Credit Scoring Engine APIdescription: Dokumentasi spesifikasi API integrasi ML Service Decision Tree (ID3) dengan Web Koperasi.version: 1.0.0servers:url: https://api.koperasi-ai.id/api/v1description: Production Serverurl: http://localhost:8000/api/v1description: Local Development Serverpaths:/scoring/predict:post:summary: Eksekusi AI Credit Scoring Engine (ID3)description: Memproses 4 atribut input untuk menghasilkan rekomendasi kelayakan kredit.operationId: predictCreditScoresecurity:- ApiKeyAuth: []requestBody:required: truecontent:application/json:schema:$ref: '#/components/schemas/ScoringPredictRequest'responses:'200':description: Scoring berhasil diprosescontent:application/json:schema:$ref: '#/components/schemas/ScoringPredictResponse''422':description: Atribut input tidak lengkap atau tidak validcontent:application/json:schema:$ref: '#/components/schemas/ErrorResponse''504':description: ML Engine Timeout (> 5 detik)content:application/json:schema:$ref: '#/components/schemas/ErrorResponse'/loans/{id}/decision:post:summary: Konfirmasi / Override Keputusan Kredit oleh Analisdescription: Analis menetapkan keputusan final (Approve/Reject) terhadap pengajuan kredit.operationId: submitAnalystDecisionsecurity:- BearerAuth: []parameters:- name: idin: pathrequired: truedescription: ID Pengajuan Pinjamanschema:type: integerrequestBody:required: truecontent:application/json:schema:$ref: '#/components/schemas/AnalystDecisionRequest'responses:'200':description: Keputusan final berhasil disimpan'403':description: Pengguna tidak memiliki akses Role Analiscomponents:securitySchemes:ApiKeyAuth:type: apiKeyin: headername: X-API-KeyBearerAuth:type: httpscheme: bearerbearerFormat: JWTschemas:ScoringPredictRequest:type: objectrequired:- job- education- housing- loanproperties:job:type: stringexample: admineducation:type: stringexample: university_degreehousing:type: stringenum: [yes, no]example: "yes"loan:type: stringenum: [yes, no]example: "no"    ScoringPredictResponse:      type: object      properties:        success:          type: boolean          example: true        prediction:          type: string          enum: [Yes, No]          example: "Yes"        recommendation:          type: string          enum: [Diterima, Ditolak]          example: "Diterima"        processing_time_ms:          type: integer          example: 125        model:          type: object          properties:            name:              type: string              example: Decision Tree            algorithm:              type: string              example: ID3            version:              type: string              example: "1.0.0"    ErrorResponse:      type: object      properties:        success:          type: boolean          example: false        error:          type: object          properties:            code:              type: string              example: ERR_AI_SERVICE_TIMEOUT            message:              type: string              example: Proses scoring AI mengalami batas waktu/gagal    AnalystDecisionRequest:      type: object      required:        - decision      properties:        decision:          type: string          enum: [approved, rejected]          example: approved        notes:          type: string          example: Disetujui sesuai rekomendasi AI